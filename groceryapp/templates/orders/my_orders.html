{% extends 'base.html' %}
{% block content %}
<h3>My Orders</h3>
<table class="table table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Date</th>
      <th>Total</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for order in orders %}
    <tr>
      <td>#{{ order.id }}</td>
      <td>{{ order.created_at|date:"Y-m-d H:i" }}</td>
      <td>₹{{ order.total_price }}</td>
      <td>{{ order.status }}</td>
      <td><a href="{% url 'order-detail' order.id %}" class="btn btn-sm btn-outline-primary">View</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-center">No orders yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
