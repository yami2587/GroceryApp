{% extends 'base.html' %}
{% block content %}
<div class="text-center py-5">
  <div class="card mx-auto shadow-sm border-0" style="max-width:480px;">
    <div class="card-body">
      <h2 class="text-success mb-3">✅ Order Placed!</h2>
      <h5 class="mb-3">Order #{{ order.id }}</h5>
      <p>Total Amount: <strong>₹{{ order.total_price }}</strong></p>
      <p class="text-muted small">Placed on {{ order.created_at|date:"M d, Y H:i" }}</p>
      <a href="/" class="btn btn-primary w-100 mt-3">Continue Shopping</a>
      <a href="{% url 'my-orders' %}" class="btn btn-outline-secondary w-100 mt-2">View My Orders</a>
    </div>
  </div>
</div>
{% endblock %}
