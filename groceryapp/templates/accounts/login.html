{% extends 'base.html' %}
{% block content %}
<div class="container col-md-4 mt-5">
  <h3 class="text-center">Login</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
  </form>
  <p class="mt-3 text-center">New user? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
