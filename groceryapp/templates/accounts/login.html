{% extends 'base.html' %}
{% block content %}
<div class="container col-md-4 mt-5">
  <h3 class="text-center">Login</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mb-2">
      <input type="checkbox" id="showpass"> Show Password
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 text-center">New user? <a href="{% url 'register' %}">Register</a></p>
</div>

<script>
document.getElementById('showpass').addEventListener('change', function(e) {
    const pass = document.getElementById('id_password');
    if (pass) pass.type = e.target.checked ? 'text' : 'password';
});
</script>
{% endblock %}
