{% extends 'base.html' %}
{% block content %}
<div class="container col-md-4 mt-5">
  <h3 class="text-center">Register</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
  </form>
  <p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
{% extends 'base.html' %}
{% block content %}
<div class="container col-md-4 mt-5">
  <h3 class="text-center">Register</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mb-2">
      <input type="checkbox" id="showpass"> Show Password
    </div>
    <button type="submit" class="btn btn-success w-100">Register</button>
  </form>
  <p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>

<script>
document.getElementById('showpass').addEventListener('change', function(e) {
    const pass1 = document.getElementById('id_password1');
    const pass2 = document.getElementById('id_password2');
    const type = e.target.checked ? 'text' : 'password';
    if (pass1) pass1.type = type;
    if (pass2) pass2.type = type;
});
</script>
{% endblock %}
