{% extends 'manager/manager_base.html' %}
{% block manager_content %}
<h2>All Products</h2>
<table>
    <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Stock</th>
        <th>Price</th>
        <th>Sold</th>
    </tr>
    {% for p in products %}
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.category.name }}</td>
        <td>{{ p.stock }}</td>
        <td>₹{{ p.price }}</td>
        <td>{{ p.sold_count }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No products yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
