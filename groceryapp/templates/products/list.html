{% extends 'base.html' %}
{% load cart_extras %}
{% block content %}
<h2>Products</h2>
<div class="row g-3">
  {% for p in products %}
  <div class="col-sm-6 col-md-4 col-lg-3">
    <div class="card product-card h-100">
      <img src="{{ p.image_url|default:'https://via.placeholder.com/400x300' }}" class="card-img-top"
        alt="{{ p.name }}">
      <div class="card-body d-flex flex-column">
        <h6 class="card-title">{{ p.name }}</h6>
        <p class="mb-1 small text-muted">{{ p.category|title }}</p>
        <p class="mb-2">₹{{ p.price }}</p>
        <div class="mt-auto d-flex gap-2">
          <form method="post" action="{% url 'cart-add-ui' %}">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ p.id }}">
            <input type="number" name="quantity" value="1" min="1" max="{{ p.stock }}"
              class="form-control form-control-sm" style="width:80px">
            <button class="btn btn-sm btn-primary">Add</button>
          </form>
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'product-detail' p.id %}">View</a>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
<div class="mt-auto d-flex gap-2">
  <form method="post" action="{% url 'cart-add-ui' %}">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ p.id }}">
    <input type="number" name="quantity" value="1" min="1" max="{{ p.stock }}" style="width:70px"
      class="form-control form-control-sm d-inline-block">
    <button class="btn btn-primary btn-sm">Add</button>
  </form>
  {% if p.id %}
  <a href="{% url 'product-detail' p.id %}" class="btn btn-outline-secondary btn-sm">View</a>
  {% else %}
  <button class="btn btn-outline-secondary btn-sm" disabled>No Link</button>
  {% endif %}
</div>

{% endblock %}
