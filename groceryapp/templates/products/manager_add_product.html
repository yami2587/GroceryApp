{% extends 'manager/manager_base.html' %}
{% block manager_content %}
<div class="container mt-4">
  <h2 class="mb-3 fw-semibold">➕ Add New Product</h2>

  <form method="POST" enctype="multipart/form-data" class="card shadow-sm border-0 p-4">
    {% csrf_token %}
    {{ form.as_p }}

<div class="mb-3 text-center">
  <img id="previewImg" src="https://via.placeholder.com/300x200?text=Preview" 
       class="img-fluid rounded shadow-sm" style="max-height:200px;">
</div>

<script>
document.addEventListener('change', function(e) {
  if (e.target.name === 'image') {
    const img = document.getElementById('previewImg');
    const file = e.target.files[0];
    if (file) img.src = URL.createObjectURL(file);
  }
});
</script>


    <!-- <div id="imagePreview" class="mt-3 text-center">
      <img id="previewImg" src="https://via.placeholder.com/300x200?text=Image+Preview"
           class="img-fluid rounded shadow-sm" style="max-height:200px;">
    </div> -->

    <div class="mt-4 text-end">
      <button type="submit" class="btn btn-success px-4">💾 Save Product</button>
      <a href="{% url 'manager_dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </div>
  </form>
</div>

<script>
function previewImage(event) {
  const img = document.getElementById('previewImg');
  const file = event.target.files[0];
  if (file) {
    img.src = URL.createObjectURL(file);
  }
}
</script>
{% endblock %}
