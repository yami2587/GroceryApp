{% extends 'manager/manager_base.html' %}
{% block manager_content %}
<h3>Low stock (≤ {{ threshold }})</h3>
<table class="table">
  <tr><th>Product</th><th>Stock</th><th>Action</th></tr>
  {% for p in low_products %}
  <tr>
    <td>{{ p.name }}</td>
    <td>{{ p.stock }}</td>
    <td>
      <form method="post" action="{% url 'product-increment-stock' p.id %}">
        {% csrf_token %}
        <input type="number" name="amount" value="10" min="1" style="width:80px">
        <button class="btn btn-sm btn-outline-primary">Restock</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="3">No low-stock products</td></tr>
  {% endfor %}
</table>
{% endblock %}
