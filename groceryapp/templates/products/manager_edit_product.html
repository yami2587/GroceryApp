{% extends 'manager/manager_base.html' %}
{% block manager_content %}
<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white fw-semibold">
      ✏️ Edit Product — {{ product.name }}
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data" class="p-3">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="mb-3">
          <label for="id_image" class="form-label">Update Product Image</label>
          <input type="file" name="image" id="id_image" class="form-control" accept="image/*" onchange="previewImage(event)">
        </div>

        <div id="imagePreview" class="mt-3 text-center">
          {% if product.image %}
            <img id="previewImg" src="{{ product.image.url }}" class="img-fluid rounded shadow-sm" style="max-height:200px;">
          {% elif product.image_url %}
            <img id="previewImg" src="{{ product.image_url }}" class="img-fluid rounded shadow-sm" style="max-height:200px;">
          {% else %}
            <img id="previewImg" src="https://via.placeholder.com/300x200?text=No+Image" class="img-fluid rounded shadow-sm" style="max-height:200px;">
          {% endif %}
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-success">💾 Save Changes</button>
          <a href="{% url 'manager-product-list' %}" class="btn btn-outline-secondary">⬅ Back</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function previewImage(event) {
  const img = document.getElementById('previewImg');
  const file = event.target.files[0];
  if (file) {
    img.src = URL.createObjectURL(file);
  }
}
</script>
{% endblock %}
